<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Queenco Loyalty Rewards</title>
  <link rel="stylesheet" href="index_style.css" />
  <link rel="stylesheet" href="jackpot/jackpot_style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-bg">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-grid"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a href="#jackpot" class="brand" aria-label="Queenco Loyalty Rewards Home">
        <img src="images/logo.webp" alt="Queenco Loyalty Rewards Logo" class="brand-logo">
      </a>

      <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" aria-label="Main Navigation">
        <a href="#jackpot" class="nav-link active" data-i18n="nav.jackpot">Loyalty - Jackpot Watch</a>
        <a href="#pointsrace" class="nav-link" data-i18n="nav.pointsrace">Loyalty - Point's Race</a>
        <a href="#loyalty" class="nav-link" data-i18n="nav.loyalty">Loyalty - Rewards</a>
        <a href="#benefits" class="nav-link" data-i18n="nav.benefits">Loyalty - Benefits</a>
      </nav>

      <div class="language-select-wrap language-dropdown" id="languageDropdown">
        <button id="languageButton" class="language-button" type="button" aria-label="Select language" aria-haspopup="listbox" aria-expanded="false">
          <span class="language-button-content">
            <img src="images/language/en.webp" alt="" class="language-flag" id="languageButtonFlag">
            <span id="languageButtonLabel">EN</span>
          </span>
          <span class="language-chevron" aria-hidden="true">⌄</span>
        </button>

        <ul class="language-menu" id="languageMenu" role="listbox" aria-label="Select language">
          <li><button type="button" class="language-option" role="option" data-lang="en"><img src="images/language/en.webp" alt="" class="language-flag">English</button></li>
          <li><button type="button" class="language-option" role="option" data-lang="zh"><img src="images/language/cn.webp" alt="" class="language-flag">Chinese</button></li>
          <li><button type="button" class="language-option" role="option" data-lang="km"><img src="images/language/khmer.webp" alt="" class="language-flag">Khmer</button></li>
          <li><button type="button" class="language-option" role="option" data-lang="id"><img src="images/language/id.webp" alt="" class="language-flag">Indonesian</button></li>
          <li><button type="button" class="language-option" role="option" data-lang="ko"><img src="images/language/kr.webp" alt="" class="language-flag">Korean</button></li>
          <li><button type="button" class="language-option" role="option" data-lang="ja"><img src="images/language/jp.webp" alt="" class="language-flag">Japanese</button></li>
        </ul>

        <select id="languageSelect" class="language-select native-language-select" aria-label="Select language" tabindex="-1">
          <option value="en">EN</option>
          <option value="zh">CN</option>
          <option value="km">Khmer</option>
          <option value="id">Indonesian</option>
          <option value="ko">Korean</option>
          <option value="ja">Japanese</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <section id="jackpot" class="section-loader"></section>

    <section id="pointsrace" class="section-loader"></section>

    <section id="loyalty" class="section-loader"></section>

    <section id="benefits" class="section-loader"></section>
  </main>

  <footer class="site-footer">
  <p>© 2026 Queenco Hotel & Casino. All rights reserved.</p>
  <p>Loyalty Rewards benefits, points, and jackpot information are subject to official terms and conditions.</p>
</footer>

  <script src="translation.js"></script>
  <script src="index_script.js"></script>
  

  
</body>
</html>
