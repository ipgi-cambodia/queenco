<div class="benefits-section">
  <div class="section-heading reveal-item">
    <span class="eyebrow" data-i18n="brand.name">Queenco Loyalty Rewards</span>
    <h1 data-i18n="benefits.title">Benefits</h1>
    <p data-i18n="benefits.subtitle">
      Enjoy exclusive rewards, premium discounts, and relaxing lifestyle privileges
      made for our valued members.
    </p>
    <br>
    <p class="tagline"><i data-i18n="benefits.tagline">It's not a magic lamp... but it's close.</i></p>
  </div>

  <div class="benefits-image-grid" aria-label="Membership benefits">
    <article class="benefit-poster-card reveal-card">
      <img
        src="images/benefits/EN-CLASSIC.webp"
        alt="Classic membership benefits"
        class="benefit-poster-img"
        data-benefit-tier="CLASSIC"
      >
    </article>

    <article class="benefit-poster-card reveal-card featured-benefit-poster">
      <img
        src="images/benefits/EN-SILVER.webp"
        alt="Silver Club membership benefits"
        class="benefit-poster-img"
        data-benefit-tier="SILVER"
      >
    </article>

    <article class="benefit-poster-card reveal-card">
      <img
        src="images/benefits/EN-GOLD.webp"
        alt="Gold Club membership benefits"
        class="benefit-poster-img"
        data-benefit-tier="GOLD"
      >
    </article>
  </div>
</div>
